<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Template</title>
  <style>
    /* Reset styles for email clients */
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table {
      border-spacing: 0;
      border-collapse: collapse;
    }
    td {
      padding: 0;
    }
    img {
      border: 0;
    }
    
    /* Responsive styles for mobile screens */
    @media screen and (max-width: 600px) {
      .content-table {
        width: 100% !important;
      }
      .padding-mobile {
        padding: 20px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Main Background Container -->
  <table width="100%" bgcolor="#f4f6f8" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding: 40px 0;">
        
        <!-- Email Body Wrapper (600px Max Width) -->
        <table class="content-table" width="600" bgcolor="#ffffff" cellpadding="0" cellspacing="0" border="0" style="border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
          
          <!-- Header Bar -->
          <tr>
            <td bgcolor="#0b1326" style="padding: 30px; text-align: center;">
              <h1 style="color: #adc6ff; margin: 0; font-size: 24px; font-weight: bold;">
                Your App Name
              </h1>
            </td>
          </tr>

          <!-- Main Content Area -->
          <tr>
            <td class="padding-mobile" style="padding: 40px 30px; color: #333333; font-size: 16px; line-height: 1.6;">
              <h2 style="color: #111111; margin-top: 0; font-size: 20px;">Welcome aboard!</h2>
              <p style="margin-bottom: 20px;">
                Thanks for signing up. Please confirm your email address to get full access to your account features and dashboard.
              </p>
              
              <!-- Call To Action Button -->
              <table cellpadding="0" cellspacing="0" border="0" style="margin: 30px 0;">
                <tr>
                  <td bgcolor="#4d8eff" style="border-radius: 6px; text-align: center;">
                    <a href="https://example.com/verify" target="_blank" style="display: inline-block; padding: 12px 24px; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 16px;">
                      Verify Email Address
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin-bottom: 0; color: #666666; font-size: 14px;">
                If you didn't request this email, you can safely ignore it.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td bgcolor="#131b2e" style="padding: 20px 30px; text-align: center; color: #8c909f; font-size: 12px;">
              <p style="margin: 0 0 8px 0;">&copy; 2026 Your Company Name. All rights reserved.</p>
              <p style="margin: 0;">
                <a href="https://example.com/unsubscribe" style="color: #adc6ff; text-decoration: underline;">Unsubscribe</a>
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
